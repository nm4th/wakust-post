name: Wakust Site Publish

# ワクストの記事を1件ずつ自社サイトに掲載する。
#   1. ワクストから記事の無料部分・有料部分・価格を取得
#   2. codoc にエントリーを作成（binded_url = 自社サイトの記事URL / 限定公開）
#   3. site_content/articles/{id}.json を書き出してコミット
#   4. コミットをトリガーに Wakust Site Deploy が Pages へ公開する
# 有料本文は codoc 側にのみ保存され、リポジトリにも公開HTMLにも出ない。

# ⏸ 停止中: ワクストへ誘導する方針にしたため、codocへの掲載は自動実行しない。
# 再開する場合は schedule のコメントを外すこと。手動実行は今も可能。
on:
  # schedule:
  #   # 朝10:00 JST (UTC 01:00), 昼13:00 JST (UTC 04:00), 夜21:00 JST (UTC 12:00)
  #   - cron: '0 1 * * *'
  #   - cron: '0 4 * * *'
  #   - cron: '0 12 * * *'
  workflow_dispatch:
    inputs:
      publish_limit:
        description: '1回の実行で掲載する記事数'
        type: string
        default: '1'

permissions:
  contents: write

concurrency:
  group: wakust-site-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium --with-deps

      - name: Publish to own site
        env:
          WAKUST_EMAIL: ${{ secrets.WAKUST_EMAIL }}
          WAKUST_PASSWORD: ${{ secrets.WAKUST_PASSWORD }}
          WAKUST_COOKIE: ${{ secrets.WAKUST_COOKIE }}
          CODOC_COOKIE: ${{ secrets.CODOC_COOKIE }}
          CODOC_USERCODE: ${{ vars.CODOC_USERCODE || secrets.CODOC_USERCODE }}
          SITE_BASE_URL: ${{ vars.SITE_BASE_URL }}
          # codoc上は限定公開にして、販売導線は自社サイトだけにする
          CODOC_LIMITED: ${{ vars.CODOC_LIMITED || '1' }}
          SITE_PUBLISH_LIMIT: ${{ inputs.publish_limit || '1' }}
          CODOC_MODE: site_publish
        run: python wakust_auto_update.py

      - name: Commit site content
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add site_content/ || true
          # wakust_state.json は .gitignore 対象だが、掲載済み判定に必要なので -f で追跡する
          git add -f wakust_state.json || true
          if ! git diff --cached --quiet; then
            git commit -m "🏬 自社サイト掲載記事を追加 $(date -u +%Y-%m-%d_%H:%M)"
            for i in 1 2 3 4; do
              git pull --rebase origin main && git push origin HEAD:main && break
              sleep $((2 ** i))
            done
          fi

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wakust-site-publish-logs-${{ github.run_id }}
          path: logs/
          retention-days: 30
