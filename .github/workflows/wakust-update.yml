name: Wakust Auto Update

on:
  schedule:
    # 毎日16:30 JSTに実行（UTC 07:30 = JST 16:30）タイトル＋回遊リストのみ
    - cron: '30 7 * * *'
  workflow_dispatch:
    inputs:
      calendar_only:
        description: 'カレンダーのみ更新する'
        type: boolean
        default: false
      title_only:
        description: 'タイトル＋回遊リストのみ更新する（16:30モード）'
        type: boolean
        default: false
  repository_dispatch:
    types: [midnight-update]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium --with-deps

      - name: Run wakust auto update
        env:
          WAKUST_EMAIL: ${{ secrets.WAKUST_EMAIL }}
          WAKUST_PASSWORD: ${{ secrets.WAKUST_PASSWORD }}
          WAKUST_COOKIE: ${{ secrets.WAKUST_COOKIE }}
          CODOC_COOKIE: ${{ secrets.CODOC_COOKIE }}
          CODOC_USERCODE: ${{ vars.CODOC_USERCODE || secrets.CODOC_USERCODE }}
          SITE_BASE_URL: ${{ vars.SITE_BASE_URL }}
          CODOC_LIMITED: ${{ vars.CODOC_LIMITED || '1' }}
          CALENDAR_ONLY: ${{ inputs.calendar_only == true && '1' || '0' }}
          TITLE_ONLY: ${{ (github.event.schedule == '30 7 * * *' || inputs.title_only == true) && '1' || '0' }}
          REPORT_EMAIL: ${{ secrets.REPORT_EMAIL }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: python wakust_auto_update.py

      - name: Commit and push logs / site content
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add logs/ site_content/ || true
          # wakust_state.json は .gitignore 対象だが、掲載済み判定に必要なので -f で追跡する
          git add -f wakust_state.json || true
          if ! git diff --cached --quiet; then
            git commit -m "📊 PVログ・自社サイト同期 $(date -u +%Y-%m-%d)"
            pushed=0
            for i in 1 2 3 4; do
              if git pull --rebase origin main && git push origin HEAD:main; then
                pushed=1; break
              fi
              sleep $((2 ** i))
            done
            # pushの失敗を握りつぶさない（403などに気づけなくなるため）
            if [ "$pushed" != "1" ]; then
              echo "::error::git push に失敗しました。Settings → Actions → General →" \
                   "Workflow permissions が 'Read and write permissions' か確認してください"
              exit 1
            fi
          fi

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wakust-logs-${{ github.run_id }}
          path: logs/
          retention-days: 30
