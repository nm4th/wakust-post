name: Wakust Threads Post

# 掲載済み記事から投稿文を組み立てて Threads に投稿する。
# 認証情報（THREADS_USER_ID / THREADS_ACCESS_TOKEN）が未設定のときは
# dry-run になり、ログに文面が出るだけで投稿はされない。

on:
  schedule:
    # 0:30 JST — 本日公開された記事の告知（無い日は何も投稿しない）
    - cron: '30 15 * * *'
    # 10:00 / 13:00 / 18:00 / 21:00 JST
    - cron: '0 1 * * *'
    - cron: '0 4 * * *'
    - cron: '0 9 * * *'
    - cron: '0 12 * * *'
  workflow_dispatch:
    inputs:
      template:
        description: '投稿テンプレート（空ならスケジュールに従う）'
        type: choice
        options: ['', aruaru, info, today, cheatsheet, week, price, lineup, rank, story, new]
        default: ''
      area:
        description: 'エリアで絞る（空なら全エリア）'
        type: string
        default: ''
      dry_run:
        description: '投稿せず文面だけ確認する'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: wakust-threads-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Pick time slot for this run
        id: pick
        run: |
          # スロット（時間帯）だけ決める。どのテンプレートを出すかは
          # site_config.json の threads.post_schedule が日替わりで決める
          case "${{ github.event.schedule }}" in
            "30 15 * * *") echo "slot=0"  >> "$GITHUB_OUTPUT" ;;
            "0 1 * * *")   echo "slot=10" >> "$GITHUB_OUTPUT" ;;
            "0 4 * * *")   echo "slot=13" >> "$GITHUB_OUTPUT" ;;
            "0 9 * * *")   echo "slot=18" >> "$GITHUB_OUTPUT" ;;
            "0 12 * * *")  echo "slot=21" >> "$GITHUB_OUTPUT" ;;
            *)             echo "slot=10" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Post to Threads
        env:
          # dry_run が true のときはトークンを渡さない → 自動的に dry-run になる
          THREADS_USER_ID: ${{ inputs.dry_run && '' || secrets.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ inputs.dry_run && '' || secrets.THREADS_ACCESS_TOKEN }}
        run: |
          if [ -n "${{ inputs.template }}" ]; then
            SELECT="--template ${{ inputs.template }}"
          else
            SELECT="--slot ${{ steps.pick.outputs.slot }}"
          fi
          python wakust_threads.py $SELECT \
            ${{ inputs.area && format('--area {0}', inputs.area) || '' }} \
            --post

      - name: Commit post history
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # 投稿履歴・手書きストックの使用履歴を保存する
          git add -f wakust_state.json || true
          if ! git diff --cached --quiet; then
            git commit -m "📣 Threads投稿履歴 $(date -u +%Y-%m-%d_%H:%M)"
            pushed=0
            for i in 1 2 3 4; do
              if git pull --rebase origin main && git push origin HEAD:main; then
                pushed=1; break
              fi
              sleep $((2 ** i))
            done
            # pushの失敗を握りつぶさない（403などに気づけなくなるため）
            if [ "$pushed" != "1" ]; then
              echo "::error::git push に失敗しました。Settings → Actions → General →" \
                   "Workflow permissions が 'Read and write permissions' か確認してください"
              exit 1
            fi
          fi
