name: Wakust Threads Post

# 掲載済み記事から投稿文を組み立てて Threads に投稿する。
# 手動実行で dry_run を選んだときだけ、ログに文面が出るだけで投稿はされない。
# 定期実行でトークンが無効・未設定だった場合はワークフローを失敗させ、
# GitHub の「ワークフロー失敗」メールで気づけるようにしている。
# メールが届かないときは https://github.com/settings/notifications の
# Actions で「Email」が有効か確認すること。

on:
  schedule:
    # JST基準。cron は UTC なので -9時間して書いている（JST = UTC+9）
    - cron: '30 15 * * *'   # 0:30  本日公開された記事の告知（無い日は投稿しない）
    - cron: '30 22 * * *'   # 7:30  通勤時間
    - cron: '0 1 * * *'     # 10:00 本日出勤
    - cron: '15 3 * * *'    # 12:15 昼休み
    - cron: '0 6 * * *'     # 15:00 エリア厳選（駅A）
    - cron: '0 9 * * *'     # 18:00 体験レポート
    - cron: '30 10 * * *'   # 19:30 エリア厳選（駅B）
    - cron: '0 12 * * *'    # 21:00 手書きネタ（info / aruaru 日替わり）
    - cron: '45 13 * * *'   # 22:45 速報
  workflow_dispatch:
    inputs:
      template:
        description: '投稿テンプレート（空ならスケジュールに従う）'
        type: choice
        options: ['', aruaru, info, today, cheatsheet, week, price, lineup, rank, story, new]
        default: ''
      area:
        description: 'エリアで絞る（空なら全エリア）'
        type: string
        default: ''
      dry_run:
        description: '投稿せず文面だけ確認する'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: wakust-threads-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Pick time slot for this run
        id: pick
        run: |
          # スロット（時間帯）だけ決める。どのテンプレートを出すかは
          # site_config.json の threads.post_schedule が日替わりで決める
          case "${{ github.event.schedule }}" in
            "30 15 * * *") echo "slot=0"  >> "$GITHUB_OUTPUT" ;;
            "30 22 * * *") echo "slot=7"  >> "$GITHUB_OUTPUT" ;;
            "0 1 * * *")   echo "slot=10" >> "$GITHUB_OUTPUT" ;;
            "15 3 * * *")  echo "slot=12" >> "$GITHUB_OUTPUT" ;;
            "0 6 * * *")   echo "slot=15" >> "$GITHUB_OUTPUT" ;;
            "0 9 * * *")   echo "slot=18" >> "$GITHUB_OUTPUT" ;;
            "30 10 * * *") echo "slot=19" >> "$GITHUB_OUTPUT" ;;
            "0 12 * * *")  echo "slot=21" >> "$GITHUB_OUTPUT" ;;
            "45 13 * * *") echo "slot=22" >> "$GITHUB_OUTPUT" ;;
            *)             echo "slot=10" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Post to Threads
        env:
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          # GitHub Actions の `A && '' || B` は A が true でも '' が falsy なため
          # B が採用されてしまう。dry-run はシェル側で明示的に外す
          if [ "$DRY_RUN" = "true" ]; then
            echo "🧪 dry-run のため認証情報を外します（実際には投稿しません）"
            unset THREADS_ACCESS_TOKEN THREADS_USER_ID
          elif [ -z "$THREADS_ACCESS_TOKEN" ]; then
            # トークンが無いと dry-run に落ちて「成功したのに投稿ゼロ」になる。
            # 黙って止まるのが一番まずいので、失敗させて通知に乗せる
            echo "::error::THREADS_ACCESS_TOKEN が未設定です。Threadsへの投稿は" \
                 "行われていません。Secrets を確認してください"
            exit 1
          fi
          if [ -n "${{ inputs.template }}" ]; then
            SELECT="--template ${{ inputs.template }}"
          else
            SELECT="--slot ${{ steps.pick.outputs.slot }}"
          fi
          python wakust_threads.py $SELECT \
            ${{ inputs.area && format('--area {0}', inputs.area) || '' }} \
            --post

      - name: Commit post history
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # 投稿履歴・手書きストックの使用履歴を保存する
          git add -f wakust_state.json || true
          if ! git diff --cached --quiet; then
            git commit -m "📣 Threads投稿履歴 $(date -u +%Y-%m-%d_%H:%M)"
            pushed=0
            for i in 1 2 3 4; do
              if git pull --rebase origin main && git push origin HEAD:main; then
                pushed=1; break
              fi
              sleep $((2 ** i))
            done
            # pushの失敗を握りつぶさない（403などに気づけなくなるため）
            if [ "$pushed" != "1" ]; then
              echo "::error::git push に失敗しました。Settings → Actions → General →" \
                   "Workflow permissions が 'Read and write permissions' か確認してください"
              exit 1
            fi
          fi
