name: Wakust Codoc Post New

on:
  # 一時停止中：自動スケジュールは無効化。必要なら workflow_dispatch で手動実行のみ可能。
  # schedule:
  #   - cron: '0 1 * * *'   # 朝10:00 JST
  #   - cron: '0 4 * * *'   # 昼13:00 JST
  #   - cron: '0 12 * * *'  # 夜21:00 JST
  workflow_dispatch: {}

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium --with-deps

      - name: Post to codoc
        env:
          WAKUST_EMAIL: ${{ secrets.WAKUST_EMAIL }}
          WAKUST_PASSWORD: ${{ secrets.WAKUST_PASSWORD }}
          WAKUST_COOKIE: ${{ secrets.WAKUST_COOKIE }}
          CODOC_COOKIE: ${{ secrets.CODOC_COOKIE }}
          CODOC_MODE: post_new
        run: python wakust_auto_update.py

      - name: Commit state changes
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add wakust_state.json || true
          git diff --cached --quiet || git commit -m "🔄 codoc投稿state更新 $(date -u +%Y-%m-%d_%H:%M)"
          git push || true
