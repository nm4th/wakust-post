name: Wakust Delete All Sets

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'ドライラン（削除せず一覧のみ表示）'
        type: boolean
        default: true

jobs:
  delete:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run delete all sets
        env:
          WAKUST_EMAIL: ${{ secrets.WAKUST_EMAIL }}
          WAKUST_PASSWORD: ${{ secrets.WAKUST_PASSWORD }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python wakust_delete_all_sets.py --dry-run
          else
            python wakust_delete_all_sets.py
          fi
