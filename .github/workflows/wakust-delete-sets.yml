name: Wakust Delete All Sets

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'ドライラン（削除せず一覧のみ表示）'
        type: boolean
        default: true

jobs:
  delete:
    # ワクストがGitHubのサーバーからのアクセスを待機画面で止めるため、
    # 自宅のMacに登録したセルフホストランナーで実行する
    runs-on: [self-hosted, macOS]
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        if: runner.os == 'Linux'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Macのセルフホストランナーでは setup-python が /Users/runner に書こうとして失敗するため、
      # uv で Python 3.11 の仮想環境をランナーのツール置き場に作って使う（2回目以降は再利用）
      - name: Set up Python (Mac)
        if: runner.os == 'macOS'
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          if ! command -v uv >/dev/null 2>&1; then
            curl -LsSf https://astral.sh/uv/install.sh | sh
          fi
          VENV="$RUNNER_TOOL_CACHE/wakust-venv"
          if [ ! -x "$VENV/bin/python" ]; then
            uv venv --seed --python 3.11 "$VENV"
          fi
          echo "$VENV/bin" >> "$GITHUB_PATH"
          "$VENV/bin/python" --version

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run delete all sets
        env:
          WAKUST_EMAIL: ${{ secrets.WAKUST_EMAIL }}
          WAKUST_PASSWORD: ${{ secrets.WAKUST_PASSWORD }}
          WAKUST_COOKIE: ${{ secrets.WAKUST_COOKIE }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python wakust_delete_all_sets.py --dry-run
          else
            python wakust_delete_all_sets.py
          fi
