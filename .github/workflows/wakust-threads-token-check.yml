name: Wakust Threads Token Check

# Threads の長期アクセストークンは60日で失効し、切れると延長できない。
# 毎日生存確認し、死んでいる／期限が近いときはワークフローを失敗させて
# GitHub の「ワークフロー失敗」メールを飛ばす。
#
# メールが届かない場合は、GitHub の通知設定を確認すること:
#   https://github.com/settings/notifications
#   → Actions →「Email」にチェック（Only notify for failed workflows でよい）

on:
  schedule:
    # 毎日 9:00 JST
    - cron: '0 0 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: wakust-threads-token-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      # トークンが空なら投稿は黙って止まる。それも失敗として扱う
      - name: Check token
        env:
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
        run: python wakust_threads_setup.py check

      # トークンの使用開始日を残す（失効の何日前かを推定するのに使う）
      - name: Commit token age record
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f wakust_state.json || true
          if ! git diff --cached --quiet; then
            git commit -m "🔑 Threadsトークンの使用開始日を記録"
            for i in 1 2 3 4; do
              if git pull --rebase origin main && git push origin HEAD:main; then
                exit 0
              fi
              sleep $((2 ** i))
            done
            echo "::warning::トークン記録のpushに失敗しました（確認自体は完了）"
          fi
